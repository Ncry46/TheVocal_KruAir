<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ครูแอร์ Singing School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Serif Thai', Georgia, serif; background: #faf6ef; color: #2e1220; }
    .loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f9e2ec; border-top-color: #fc007a; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { width: 100%; height: 100vh; border: none; position: fixed; top: 0; left: 0; }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>กำลังโหลด ครูแอร์ Singing School...</p>
  </div>
  <script>
    // Try to load from dev server
    var iframe = document.createElement('iframe');
    iframe.src = 'http://localhost:5173';
    iframe.onload = function() {
      document.getElementById('loading').style.display = 'none';
      iframe.style.display = 'block';
    };
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    // Fallback if iframe fails
    setTimeout(function() {
      if (document.getElementById('loading').style.display !== 'none') {
        window.location.href = 'http://localhost:5173';
      }
    }, 3000);
  </script>
</body>
</html>
