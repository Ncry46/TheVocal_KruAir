name: kruair

# One image for coop: thanvasu/web-kruair
# .env is copied into the image; compose can still override via bind mount.

services:
  app:
    image: thanvasu/web-kruair:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      SQL_CLIENT: tedious
      PORT: "3000"
      SQL_SERVER: tvsdb2.thanvasupos.com,28914
      FRONTEND_ORIGIN: http://localhost:3000
      LINE_CALLBACK_URL: http://localhost:3000/api/auth/line/callback
    volumes:
      - ./backend/.env:/app/.env:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
